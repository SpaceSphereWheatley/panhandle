# Architecture: Pages hosts the frontend, Worker handles API + routing.
# You will deploy via the Cloudflare dashboard, not the CLI.
#
# Schema/data migrations (migrations/*.sql): the developer installs nothing
# locally, so they're applied by hand against production D1 via the
# mcp__Cloudflare_Developer_Platform__d1_database_query tool, NOT Wrangler's
# runner. Migrations must be expand/contract (additive, backward-compatible),
# because the migration lands before the new code finishes deploying — and
# because Cloudflare branch/commit previews bind this same production DB (see
# the note below), so a preview runs new code against prod data too. The
# `d1_migrations` table tracks what's applied. See CLAUDE.md's "Databases" /
# "Applying migrations" for the full runbook.

name = "panhandle"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Single production D1. NOTE: `preview_database_id` is deliberately NOT set —
# it only affects `wrangler dev`, not Workers Builds deploy previews, which
# always bind `database_id`. We verified this empirically: a login against the
# branch-preview Worker landed in the production DB, not a preview one. So
# there is no data isolation between prod and the branch/commit preview
# deploys — a preview reads and writes production data. That's why migrations
# must be expand/contract, and why preview click-testing must treat prod as
# live (clean up any throwaway accounts).
[[d1_databases]]
binding = "DB"
database_name = "panhandle"
database_id = "04cab403-1be9-43d7-bd07-6fc009385ab0"

# Drives runReminderPass (worker/index.js) — the "no meal planned for
# tomorrow" push notification (TODO #7 phase 1). 15-minute granularity
# matches the 15-min steps notification_settings.meal_reminder_time is
# snapped to in the frontend's time picker.
[triggers]
crons = ["*/15 * * * *"]

# Public domain: panhandle.app is now attached as a custom domain (Worker ->
# Settings -> Domains & Routes) alongside the historical shopping.mohibb.com,
# which stays attached until the cutover is fully verified (see
# docs/android-publishing.md's checklist) — Android/Play Store publishing
# surfaces this domain publicly, hence the move off a personal one.
# `workers_dev = true` keeps the workers.dev route enabled too, alongside
# both custom domains.
workers_dev = true

# Non-secret config, safe to version-control. APP_ORIGIN is used to build
# links in emails (e.g. the password-reset URL). EMAIL_FROM_ADDRESS is
# separate and still on shopping.mohibb.com because Resend needs its own
# DNS-verified sending domain, which doesn't have to be the same domain
# users see in the browser — flip it to noreply@panhandle.app once that
# domain is verified in Resend (docs/android-publishing.md step 4).
[vars]
APP_ORIGIN = "https://panhandle.app"
EMAIL_FROM_ADDRESS = "Panhandle <noreply@shopping.mohibb.com>"

# Secrets (set under Worker -> Settings -> Variables and Secrets):
#   JWT_SECRET            - long random string, signs login tokens
#   TURNSTILE_SECRET_KEY  - Cloudflare Turnstile secret key (Turnstile dashboard, separate from Workers)
#   RESEND_API_KEY        - Resend API key, needs a DNS-verified sending domain first (resend.com dashboard)
#   VAPID_PUBLIC_KEY      - Web Push VAPID public key (base64url), generate via `npx @pushforge/builder vapid`
#   VAPID_PRIVATE_KEY     - matching VAPID private key, JSON-serialized JWK from the same command
# GOOGLE_CLIENT_ID (worker/index.js) is not secret (shipped in frontend JS
# too) - update the hardcoded constant there directly after creating an OAuth
# client in Google Cloud Console, no dashboard variable needed.
