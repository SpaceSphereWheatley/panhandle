<!-- Foreground-only mark from panhandle-icon.svg, scaled by 0.78 (any solid
     opaque color works — Android's themed-icon feature discards color and
     keeps only alpha) so the ring+handle's farthest point sits at radius
     ~147px, inside the ~169px (33% of the 512 canvas) safe-zone Android
     requires for adaptive-icon monochrome/foreground layers. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <circle cx="256" cy="256" r="83.46" fill="none" stroke="#000000" stroke-width="39"/>
  <rect x="325.42" y="236.5" width="76.44" height="39" rx="19.5" fill="#000000"/>
</svg>
